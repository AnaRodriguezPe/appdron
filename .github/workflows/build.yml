name: Compilar APK Kivy

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Compilar APK usando Buildozer Action
        uses: kivy/buildozer-action@v1
        with:
          filename: buildozer.spec
          android_debug: true

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
